name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find out whether only docs changed
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | node .github/scripts/docs-only.mjs | tee scope.txt
          grep '^docs-only=' scope.txt >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.scope.outputs.docs-only != 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.scope.outputs.docs-only != 'true'
        with:
          cache-provider: basic
          cache-read-only: false
          validate-wrappers: true
      - name: Cache Gradle dependencies across build-file changes
        if: steps.scope.outputs.docs-only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-deps-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-
      - name: Cache Robolectric's Android runtime jars
        if: steps.scope.outputs.docs-only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test the CI scripts
        run: node --test ".github/scripts/*.test.mjs"
      - name: Check the help pages
        run: node .github/scripts/check-help.mjs
      - name: Run the Gradle check
        if: steps.scope.outputs.docs-only != 'true'
        run: node .github/scripts/gradle.mjs check
      - name: Upload the reports when the check fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7

name: Release artefacts

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attach:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true
      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ "$TAG" =~ ^v([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]] || { echo "::error::Tag $TAG is not vX.Y.Z"; exit 1; }
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Secret $name is not set"; exit 1; }
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_PATH"
          node .github/scripts/gradle.mjs :app:assembleRelease -PappVersion="${TAG#v}"
      - name: Verify the signature and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="deaftly-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk"
          gh release upload "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Build the bundle for Google Play
        id: bundle
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::warning::PLAY_UPLOAD_KEYSTORE_BASE64 isn't set, so no bundle was built for Google Play."
            exit 0
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::The Play upload secret behind $name is not set"; exit 1; }
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/play-upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          base64 --decode <<< "$PLAY_UPLOAD_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_PATH"
          node .github/scripts/gradle.mjs :app:bundleRelease -PappVersion="${TAG#v}"
          aab="deaftly-${TAG#v}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          echo "file=$aab" >> "$GITHUB_OUTPUT"
      - name: Keep the bundle for a manual upload
        if: steps.bundle.outputs.file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: ${{ steps.bundle.outputs.file }}
          retention-days: 30
      - name: Upload the bundle to Google Play internal testing
        if: steps.bundle.outputs.file != '' && vars.PLAY_UPLOADS_ENABLED == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.oneloneraven.deaftly
          releaseFiles: ${{ steps.bundle.outputs.file }}
          releaseName: ${{ env.TAG }}
          track: internal
          status: completed
      - name: Warn if deaftly.com can't be asked to rebuild
        if: vars.SITE_DISPATCH_APP_CLIENT_ID == ''
        run: echo "::warning::SITE_DISPATCH_APP_CLIENT_ID isn't set, so deaftly.com won't rebuild for $TAG until its next deploy."
      - name: Mint a token that can only reach deaftly-website
        if: vars.SITE_DISPATCH_APP_CLIENT_ID != ''
        id: site-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SITE_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITE_DISPATCH_APP_PRIVATE_KEY }}
          owner: oneloneraven
          repositories: deaftly-website
          permission-contents: write
      - name: Ask deaftly.com to rebuild with this release
        if: vars.SITE_DISPATCH_APP_CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
        run: gh api repos/oneloneraven/deaftly-website/dispatches -f event_type=app-released

name: Release artefacts

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true
      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ "$TAG" =~ ^v([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]] || { echo "::error::Tag $TAG is not vX.Y.Z"; exit 1; }
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Secret $name is not set"; exit 1; }
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_PATH"
          ./gradlew :app:assembleRelease -PappVersion="${TAG#v}"
      - name: Verify the signature and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="deaftly-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk"
          gh release upload "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Warn if deaftly.com can't be asked to rebuild
        if: vars.SITE_DISPATCH_APP_CLIENT_ID == ''
        run: echo "::warning::SITE_DISPATCH_APP_CLIENT_ID isn't set, so deaftly.com won't rebuild for $TAG until its next deploy."
      - name: Mint a token that can only reach deaftly-website
        if: vars.SITE_DISPATCH_APP_CLIENT_ID != ''
        id: site-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SITE_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITE_DISPATCH_APP_PRIVATE_KEY }}
          owner: oneloneraven
          repositories: deaftly-website
          permission-contents: write
      - name: Ask deaftly.com to rebuild with this release
        if: vars.SITE_DISPATCH_APP_CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
        run: gh api repos/oneloneraven/deaftly-website/dispatches -f event_type=app-released

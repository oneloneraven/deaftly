naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    excludes:
      - "**/test/**"
      - "**/testFixtures/**"
      - "**/androidTest/**"
      - "**/ui/theme/**"
complexity:
  LongParameterList:
    ignoreDefaultParameters: true
